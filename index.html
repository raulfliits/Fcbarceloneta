<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#c92131">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mariners 16">
<title>Mariners Fútbol 16 bits · C.F. Barceloneta Sub 12 A</title>
<meta name="description" content="Videojuego de fútbol 7 en pixel art 16 bits del C.F. Barceloneta Sub 12 A. Partido libre, Liga ACDEA 26/27 y Copa.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --red:#c92131;--red2:#8e1220;--cream:#f7efdc;--ink:#14182a;--ink2:#222a45;--gold:#f2c14e;--green:#2f8f3e;
  --f:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--cream);font-family:var(--f);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#app{container:app/size;position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;background:#1b4d27}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;display:none}
#score{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;white-space:nowrap;
  background:#08080f;padding:6px 14px;font-size:14px;color:#fff;border-left:10px solid #4fd6ff;border-right:10px solid var(--red);
  box-shadow:0 3px 0 #000,0 0 0 2px #2a2a3a;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%)}
#score img{width:24px;height:24px}
#score .sc{color:#f6d34a;font-size:18px;min-width:70px;text-align:center;text-shadow:2px 2px 0 #8a4b00}
#score .tm{background:#f6d34a;color:#08080f;padding:4px 6px;font-size:10px}
#ctrlCard{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:7px;background:#08080f;border:2px solid #f6d34a;box-shadow:3px 3px 0 #000;padding:3px 8px 3px 3px;font-size:9px}
#ctrlCard img{width:38px;height:38px;border:2px solid #fff;background:#333}
#ctrlCard b{display:block;color:#f6d34a;font-size:12px;margin-bottom:4px}
#pauseBtn{position:absolute;right:8px;top:8px;pointer-events:auto;width:40px;height:40px;font:14px var(--f);background:var(--ink);color:var(--cream);border:3px solid var(--cream)}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;display:none;pointer-events:none}
#banner .big{display:inline-block;font-size:clamp(30px,9cqw,72px);color:#f6d34a;letter-spacing:.06em;animation:pop .35s steps(4),flash .24s steps(1) infinite;
  text-shadow:4px 4px 0 var(--red2),8px 8px 0 #000,-2px -2px 0 #fff}
#banner .sub{margin-top:16px;font-size:clamp(11px,2.4cqw,18px);text-shadow:2px 2px 0 #000;display:flex;align-items:center;justify-content:center;gap:12px}
#banner .sub img{width:84px;height:84px;border:4px solid #fff;box-shadow:0 0 0 4px var(--red),6px 6px 0 4px #000}
@keyframes flash{50%{color:#fff;text-shadow:4px 4px 0 #1d63c6,8px 8px 0 #000,-2px -2px 0 #f6d34a}}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
/* touch */
#touch{position:absolute;inset:0;pointer-events:none;display:none}
#joy{position:absolute;left:0;bottom:0;width:50%;height:60%;pointer-events:auto}
#joyBase{position:absolute;width:110px;height:110px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(0,0,0,.18);display:none;transform:translate(-50%,-50%)}
#joyKnob{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.55);left:50%;top:50%;transform:translate(-50%,-50%)}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:3px solid rgba(255,255,255,.75);color:#fff;font:9px var(--f);
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.4;text-shadow:1px 1px 0 #000}
.tb.on{filter:brightness(1.5);transform:scale(.94)}
#bA{right:22px;bottom:70px;width:84px;height:84px;background:rgba(201,33,49,.75)}
#bB{right:116px;bottom:22px;width:70px;height:70px;background:rgba(40,90,200,.7)}
#bS{right:26px;bottom:164px;width:58px;height:58px;background:rgba(242,193,78,.6);font-size:8px}
/* screens */
#screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;touch-action:pan-y;
  background:linear-gradient(180deg,rgba(20,24,42,.94),rgba(20,24,42,.98));padding:16px 16px 40px}
#screen.clear{background:rgba(20,24,42,.72)}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-weight:normal;margin:0}
.title{text-align:center;padding-top:6px}
.title .logo{width:96px;height:96px}
.title h1{font-size:clamp(20px,5.4cqw,40px);color:#fff;text-shadow:4px 4px 0 var(--red),8px 8px 0 #000;line-height:1.3;margin:14px 0 6px}
.title h1 span{display:block;font-size:.42em;color:var(--gold);text-shadow:2px 2px 0 #000;letter-spacing:.3em;margin-top:10px}
.photo{display:block;margin:16px auto;width:min(384px,92%);border:4px solid var(--cream);box-shadow:0 0 0 4px var(--red),8px 8px 0 4px #000}
.blink{animation:blink 1s steps(2) infinite;color:var(--gold);font-size:12px;margin-top:14px}
@keyframes blink{50%{opacity:0}}
.menu{display:grid;gap:12px;max-width:420px;margin:18px auto}
.btn{font:12px var(--f);color:var(--ink);background:var(--cream);border:4px solid var(--ink);box-shadow:0 0 0 3px var(--cream),5px 5px 0 3px #000;
  padding:14px 12px;cursor:pointer;text-align:center;line-height:1.5;text-transform:uppercase}
.btn small{display:block;font-size:8px;color:#6b5b55;margin-top:6px;text-transform:none}
.btn:hover,.btn:focus{background:var(--gold);outline:none;transform:translate(-2px,-2px)}
.btn.red{background:var(--red);color:#fff}.btn.red small{color:#ffd9d9}
.btn.red:hover,.btn.red:focus{background:#e2384a}
.btn.sm{font-size:9px;padding:9px 10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hdr h2{font-size:clamp(13px,3.4cqw,20px);color:var(--gold);text-shadow:2px 2px 0 #000;line-height:1.4}
.hdr .back{margin-left:auto}
.panel{background:var(--ink2);border:3px solid var(--cream);box-shadow:4px 4px 0 #000;padding:12px;margin:12px 0}
.panel h3{font-size:11px;color:var(--gold);margin-bottom:10px}
.muted{color:#a8a3b8;font-size:9px;line-height:1.7}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.team{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:9px;line-height:1.5;padding:12px 6px}
.team img{width:48px;height:48px}
.team em{font-style:normal;font-size:7px;color:#6b5b55}
table{border-collapse:collapse;width:100%;font-size:9px}
th,td{padding:6px 4px;text-align:center;border-bottom:2px solid #333b5c;white-space:nowrap}
th{color:var(--gold);font-weight:normal}
td.l,th.l{text-align:left}
tr.me td{background:rgba(201,33,49,.45);color:#fff}
td img{width:16px;height:16px;vertical-align:middle;margin-right:6px}
.scroll{overflow-x:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.card{background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--cream),4px 4px 0 3px #000;padding:10px;display:flex;gap:10px;cursor:pointer;position:relative;font:10px var(--f);text-align:left}
.card img{width:56px;height:56px;border:3px solid var(--red);background:#ddd}
.card .num{font-size:18px;color:var(--red)}
.card .nm{margin:5px 0;font-size:10px}
.card .pos{font-size:8px;color:#6b5b55}
.bars{display:grid;grid-template-columns:auto 1fr;gap:3px 5px;font-size:7px;margin-top:6px;align-items:center}
.bar{height:5px;background:#d7cbb0}.bar i{display:block;height:100%;background:var(--red)}
.inj{position:absolute;right:6px;top:6px;background:var(--red);color:#fff;font-size:7px;padding:3px 4px}
.card.out{opacity:.6;filter:grayscale(.7)}
/* lineup */
.pitch{position:relative;width:100%;max-width:520px;aspect-ratio:16/10;margin:0 auto;background:repeating-linear-gradient(90deg,#3fa046 0 12.5%,#47ad4f 12.5% 25%);border:3px solid #fff;box-shadow:4px 4px 0 #000}
.pitch:before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.8)}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;font:7px var(--f);color:#fff;text-shadow:1px 1px 0 #000;cursor:pointer;background:none;border:none;padding:0}
.slot img{width:34px;height:34px;border:2px solid #fff;background:#ddd}
.slot.sel img,.bench .sel{outline:3px solid var(--gold)}
.bench{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.bench button{font:8px var(--f);background:var(--cream);color:var(--ink);border:3px solid var(--ink);padding:5px;display:flex;align-items:center;gap:6px;cursor:pointer}
.bench button img{width:28px;height:28px}
.bench button.out{opacity:.5;cursor:not-allowed}
.opt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0;font-size:10px}
.opt .btn{padding:8px 10px;font-size:9px}
.opt .btn.on{background:var(--gold)}
.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.faces button{padding:0;border:3px solid var(--cream);background:#ddd;cursor:pointer}
.faces button.on{border-color:var(--gold);outline:3px solid var(--red)}
.faces img{width:100%;display:block}
.bracket{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:8px}
.bracket .col{display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.tie{background:var(--ink2);border:2px solid #4b5478;padding:5px}
.tie div{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:3px 0}
.tie img{width:14px;height:14px}
.tie .w{color:var(--gold)}
.tie.me{border-color:var(--red)}
.res{text-align:center}
.res .big{font-size:clamp(26px,8cqw,52px);color:var(--gold);text-shadow:4px 4px 0 var(--red2);margin:14px 0}
.res .vs{display:flex;align-items:center;justify-content:center;gap:16px;font-size:10px;line-height:1.5}
.res .vs img{width:64px;height:64px}
.list{font-size:9px;line-height:2}
.keys{font-size:9px;line-height:2.1}
.keys b{display:inline-block;background:var(--cream);color:var(--ink);padding:1px 5px;margin:0 2px}
#rotate{display:none}
/* arcade */
.attract{text-align:center;padding-top:4px}
.p1{display:flex;justify-content:space-between;font-size:11px;color:#4fd6ff;max-width:640px;margin:0 auto 10px}
.p1 span:last-child{color:#ff6b7a}
.faceRow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:8px auto}
.faceRow figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:7px}
.faceRow img{width:58px;height:58px;border:3px solid #fff;box-shadow:0 0 0 3px var(--red),3px 3px 0 3px #000;background:#333}
.faceRow b{color:#f6d34a;font-size:10px;font-weight:normal}
.faceRow.all{max-width:640px;gap:8px 5px}.faceRow.all figure{width:62px}.faceRow.all img{width:46px;height:46px;border-width:2px;box-shadow:0 0 0 2px var(--red),2px 2px 0 2px #000}.faceRow.all b{font-size:9px}
.faceRow.all figure{color:var(--cream)}
html.gb .attract .photo,html.gb .attract .muted{display:none}
html.gb .attract .logoArc{font-size:24px;margin:4px 0 8px}
html.gb .attract .p1{margin-bottom:4px}
html.gb .faceRow.all{gap:5px 3px;margin:2px auto 4px;max-width:400px}
html.gb .faceRow.all figure{width:46px;font-size:5px;gap:2px}
html.gb .faceRow.all img{width:36px;height:36px}
html.gb .faceRow.all b{font-size:7px}
html.gb .attract .btn{padding:10px 18px!important;font-size:11px!important}
html.gb .attract .blink{margin-top:8px;font-size:9px}
/* menú principal compacto dentro de la consola: todas las opciones a la vista */
html.gb #screen{padding:10px 12px 16px}
html.gb .hdr{margin-bottom:8px;gap:8px}
html.gb .hdr h2{font-size:12px}
html.gb .hdr img{width:26px;height:26px}
html.gb .menu{grid-template-columns:1fr 1fr;gap:8px;margin:6px auto;max-width:none}
html.gb .menu .btn{padding:10px 6px;font-size:10px;box-shadow:0 0 0 2px var(--cream),3px 3px 0 2px #000;border-width:3px}
html.gb .menu .btn small{display:none}
html.gb .menu .btn:first-child{grid-column:1/-1}
.logoArc{font-size:clamp(26px,7cqw,54px);line-height:1.15;margin:16px 0 4px;color:#f6d34a;text-shadow:3px 3px 0 #c92131,6px 6px 0 #5a0d16,9px 9px 0 #000;letter-spacing:.04em}
.logoArc small{display:block;font-size:.36em;color:#fff;text-shadow:2px 2px 0 #000;letter-spacing:.35em;margin-top:12px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;max-width:760px;margin:6cqh auto 0;text-align:center;font-size:clamp(9px,2cqw,13px);line-height:1.6}
.vs img.cr{width:clamp(72px,16cqw,128px);height:clamp(72px,16cqw,128px)}
.vs .x{font-size:clamp(34px,9cqw,80px);color:#f6d34a;text-shadow:4px 4px 0 var(--red),8px 8px 0 #000;animation:flash .5s steps(1) infinite}
.vsL{animation:inL .45s steps(6)}.vsR{animation:inR .45s steps(6)}
@keyframes inL{from{transform:translateX(-60cqw)}}@keyframes inR{from{transform:translateX(60cqw)}}
@media (prefers-reduced-motion:reduce){.vsL,.vsR,.vs .x,#banner .big,.blink{animation:none}}
@container app (max-width:640px){#ctrlCard{top:60px}#score{font-size:10px}}

/* ===== Consola MARINERS Brick (móvil / tablet) ===== */
html.gb body{background:radial-gradient(ellipse at 50% 30%,#2b2d33,#0b0b0e 70%)}
html.gb #app{position:absolute;left:0;top:0;inset:auto;padding:0;transform-origin:0 0}
html.gb #touch{display:none!important}
#console{--body:#d3cfc9;--body2:#bdb8b1;--edge:#a39e96;--btn:#7a2232;--btn2:#5a1424;--ink2:#3a3a40;
 --vh:calc(100dvh - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));--vw:calc(100vw - 12px);
 position:fixed;left:50%;top:calc(50% + (env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) / 2);transform:translate(-50%,-50%);box-sizing:border-box;
 width:min(var(--vw),calc(var(--vh) * .64));height:min(var(--vh),calc(var(--vw) / .64));container-type:size;
 display:flex;flex-direction:column;padding:2.2% 2.2% 0;
 background:linear-gradient(170deg,#dcd8d2,var(--body) 40%,var(--body2));border-radius:18px 18px 26px 26px;
 box-shadow:inset 0 0 0 2px #ebe8e3,inset -4px -6px 0 var(--edge),0 20px 60px rgba(0,0,0,.6);font-family:var(--f);color:var(--ink2)}
#console:before,#console:after{content:"";position:absolute;width:5px;border-radius:3px;background:#9e998f}
#console:before{left:-4px;top:9%;height:7%;box-shadow:0 9cqh 0 #9e998f,0 18cqh 0 #9e998f}
#console:after{right:-4px;top:12%;height:9%}
.c-glass{flex:none;background:#050506;border-radius:12px 12px 4px 4px;padding:3.2% 3.2% 2.6%;box-shadow:inset 0 0 0 2px #1d1d22}
.c-screen{position:relative;width:100%;aspect-ratio:4/3;max-height:52cqh;margin:0 auto;overflow:hidden;background:#000}
.c-led{position:absolute;right:4.5%;top:1.6%;width:6px;height:6px;border-radius:50%;background:#ff3a4e;box-shadow:0 0 6px #ff3a4e}
.c-brand{display:flex;align-items:center;gap:6px;margin:8px 0 0 3%;font-size:clamp(7px,2.3cqw,10px);color:#6d6a64;letter-spacing:.06em}
.c-brand b{color:var(--btn);font-weight:normal}
.c-brand small{background:#7d7a74;color:#ece9e4;padding:2px 4px;font-size:.8em}
.c-ctrl{flex:1 1 auto;min-height:0;display:grid;grid-template:"ls abxy" 1fr "mid mid" auto "foot foot" auto/1fr 1fr;align-items:center;justify-items:center;padding:0 2%}
.c-dpad{grid-area:pad;width:clamp(96px,30cqw,140px);aspect-ratio:1;display:grid;grid-template:1fr 1fr 1fr/1fr 1fr 1fr;touch-action:none;filter:drop-shadow(0 4px 0 #1a1a1e)}
.c-dpad b,.c-dpad i{background:#3a3a40;display:flex;align-items:center;justify-content:center;color:#5c5c66;font-size:9px;font-weight:normal}
.c-dpad i{grid-area:2/2}.c-dpad i:after{content:"";width:46%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 2px #2a2a30}
.c-dpad .u{grid-area:1/2;border-radius:5px 5px 0 0}.c-dpad .d{grid-area:3/2;border-radius:0 0 5px 5px}
.c-dpad .l{grid-area:2/1;border-radius:5px 0 0 5px}.c-dpad .r{grid-area:2/3;border-radius:0 5px 5px 0}
.c-dpad b.on{background:#4a4a52;color:#f6d34a}
.c-mid{grid-area:mid;display:flex;gap:18px;margin:4px 0}
.c-mid div{display:grid;justify-items:center;gap:5px;font-size:6px;color:#6d6a64}
.c-mid button{width:clamp(34px,11cqw,48px);height:12px;border:0;border-radius:8px;background:#f2f0ec;box-shadow:0 2px 0 #9e998f;touch-action:none;padding:0}
.c-abxy{grid-area:abxy;position:relative;width:clamp(116px,36cqw,170px);aspect-ratio:1}
.c-abxy .k{position:absolute;width:31%;aspect-ratio:1;display:grid;place-items:center}
.c-abxy button{width:100%;height:100%;border:0;border-radius:50%;padding:0;touch-action:none;color:#e9b9c1;font:clamp(9px,3cqw,13px) var(--f);
 background:radial-gradient(circle at 38% 32%,#a33447,var(--btn) 60%);box-shadow:0 4px 0 var(--btn2),0 0 0 2px #c2bdb6}
.c-abxy span{position:absolute;white-space:nowrap;font-size:clamp(5px,1.7cqw,7px);color:#5a1424;line-height:1.4;text-align:center}
.c-abxy .x{left:34.5%;top:0}.c-abxy .x span{bottom:104%}
.c-abxy .y{left:0;top:34.5%}.c-abxy .y span{top:104%}
.c-abxy .a{right:0;top:34.5%}.c-abxy .a span{top:104%}
.c-abxy .b{left:34.5%;bottom:0}.c-abxy .b span{top:104%}
.c-abxy .a button{background:radial-gradient(circle at 38% 32%,#e0475c,#b80a26 60%);color:#ffd9de}
.c-stick{width:clamp(110px,38cqw,170px);aspect-ratio:1;border-radius:50%;position:relative;touch-action:none;background:#f4f2ee;box-shadow:0 0 0 2px #b0aba3,inset 0 3px 6px rgba(0,0,0,.25)}
.c-stick.l{grid-area:ls}.c-stick.r{grid-area:rs}
.c-knob{position:absolute;left:50%;top:50%;width:82%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
 background:radial-gradient(circle at 40% 35%,#4a4a52,#232328 65%);box-shadow:0 5px 0 #121215,inset 0 0 0 5px #2c2c33}
.c-knob:after{content:"";position:absolute;inset:16%;border-radius:50%;border:2px dashed #3d3d46}
.c-stick.on .c-knob{box-shadow:0 2px 0 #121215,inset 0 0 0 5px #2c2c33}
.c-stick em{position:absolute;top:104%;left:50%;transform:translateX(-50%);font-style:normal;font-size:6px;color:#6d6a64;white-space:nowrap}
.c-foot{grid-area:foot;width:100%;display:flex;align-items:center;justify-content:space-between;padding:6px 3% 12px}
.c-foot .spk{display:grid;grid-template-columns:repeat(7,4px);gap:3px}.c-foot .spk i{width:4px;height:4px;border-radius:50%;background:#2a2a30}
.c-foot .sys{display:flex;gap:14px}
.c-foot .sys button{width:clamp(22px,7cqw,30px);aspect-ratio:1;border:0;border-radius:50%;background:#3a3a40;color:#9a9aa4;font-size:8px;padding:0;box-shadow:0 3px 0 #1a1a1e;touch-action:none}
#console button:active,#console button.on{filter:brightness(1.25);translate:0 2px;box-shadow:none}
/* Móvil en horizontal: cruceta y joystick a la izquierda, botones y joystick a la derecha */
@media (orientation:landscape) and (max-height:560px){
 #console{--vh:calc(100dvh - 12px);--vw:calc(100vw - 12px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));width:min(var(--vw),calc(var(--vh) * 2.05));height:min(var(--vh),calc(var(--vw) / 2.05));top:50%;
  display:grid;grid-template:"ls glass abxy" 1fr "mid brand foot" auto/minmax(150px,1fr) auto minmax(150px,1fr);padding:8px 10px 6px;border-radius:24px;gap:0 10px}
 .c-glass{grid-area:glass;align-self:center;height:min(calc(100cqh - 30px),calc((100cqw - 340px) * .75 + 16px));display:flex;padding:8px;border-radius:10px}
 .c-glass .c-screen{height:100%;width:auto;max-height:none}
 .c-brand{grid-area:brand;justify-content:center;margin:4px 0 0}
 .c-ctrl{display:contents}
 .c-abxy{width:min(90%,140px);align-self:center;margin-top:8px}.c-abxy .x span{bottom:auto;top:30%;right:106%;left:auto}.c-stick{width:min(80%,130px);align-self:center}.c-mid{justify-self:center}.c-led{display:none}
 .c-mid{grid-area:mid;align-self:center;margin:0}
 .c-foot{grid-area:foot;padding:0;justify-content:center}.c-foot .spk{display:none}
}
</style>
</head>

    <div id="score"><img class="px" id="sHome" alt=""><span id="sHomeN"></span><span class="sc" id="sSc">0 - 0</span><span id="sAwayN"></span><img class="px" id="sAway" alt=""><span class="tm" id="sTm">0'</span></div>

  </div>
  <div id="touch">

    <div class="tb" id="bA">CHUTAR<br>SEGADA</div>
    <div class="tb" id="bB">PASAR<br>DEFENDER</div>

</div>
